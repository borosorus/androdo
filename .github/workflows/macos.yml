name: macOS Swift app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  swift:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show selected Apple tools
        run: |
          xcode-select -p
          swift --version

      - name: Run Swift tests
        run: swift test

      - name: Build and verify app bundle
        run: macos/build-app.sh

      - name: Check bundle contents
        run: |
          test -x dist/PhoneBackup.app/Contents/MacOS/PhoneBackupApp
          test -f dist/PhoneBackup.app/Contents/Info.plist
          test "$(cat dist/PhoneBackup.app/Contents/PkgInfo)" = 'APPL????'
          test -f dist/PhoneBackup.app/Contents/_CodeSignature/CodeResources
          test "$(find dist/PhoneBackup.app/Contents -type f | wc -l | tr -d ' ')" = 4
