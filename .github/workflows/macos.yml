name: macOS Swift app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  swift:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show selected Apple tools
        run: |
          xcode-select -p
          swift --version

      - name: Run Swift tests
        run: swift test

      - name: Build and verify app bundle
        run: macos/build-app.sh

      - name: Check bundle contents
        run: |
          test -x dist/Androdo.app/Contents/MacOS/Androdo
          test -f dist/Androdo.app/Contents/Info.plist
          test "$(cat dist/Androdo.app/Contents/PkgInfo)" = 'APPL????'
          test -f dist/Androdo.app/Contents/_CodeSignature/CodeResources
          test -f dist/Androdo.app/Contents/Resources/Androdo.icns
          test -x dist/Androdo.app
          codesign --verify --deep --strict dist/Androdo.app
