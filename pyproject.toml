[project]
name = "phonebackup"
dynamic = ["version"]
description = "Non-destructive Android file backups over ADB"
readme = "README.md"
license = {file = "LICENSE"}

requires-python = ">=3.8"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/BuildWithDuke/bestest-adb-sync/"

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
adbsync = "BestestADBSync:main"
phonebackup = "BestestADBSync:backup_main"

[tool.setuptools.dynamic]
version = {attr = "BestestADBSync.__version__"}

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
